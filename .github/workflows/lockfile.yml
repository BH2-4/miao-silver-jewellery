name: Generate lockfile

# 生成 Gemfile.lock 后自动提交回同一分支。
# 背景：开发机到 rubygems 镜像的 bundler 元数据请求不稳定，
# 用 GitHub Actions 的数据中心网络做一次依赖解析。
on:
  push:
    branches: ["main"]
    paths: ["backend/Gemfile"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: latest
      - name: Resolve dependencies
        run: bundle lock --verbose
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git commit -m "chore: generate Gemfile.lock via CI" || echo "nothing to commit"
          git push

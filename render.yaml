# Render Blueprint — Miao Silver Jewellery backend
# 开通：Render Dashboard → New → Blueprint → 选择本仓库
# 注意不可变字段：数据库 region / postgresMajorVersion 创建后不可改
databases:
  - name: miao-db
    databaseName: miao_silver_jewellery
    user: miao_app
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: miao-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    region: oregon
    healthCheckPath: /up
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: miao-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_LEVEL
        value: info
      - key: RAILS_STORAGE_SERVICE
        value: local # 正式接单前切 s3/r2（见 docs/DEPLOYMENT.md §6）
      - key: RAILS_MASTER_KEY
        sync: false # 在 Dashboard 手工填入 backend/config/master.key 内容，勿提交仓库

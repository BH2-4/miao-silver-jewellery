<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miao Silver Jewellery — Handcrafted Silver from Guizhou</title>
<!-- noindex：占位页阶段不被收录；正式开站时删除此行 -->
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #17181a;
    --silver: #d8dbe0;
    --muted: #8b8f96;
    --accent: #c0c6cf;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--silver);
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .kicker {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1.5rem;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 400;
    letter-spacing: 0.04em;
  }
  .rule {
    width: 64px;
    height: 1px;
    background: var(--accent);
    margin: 2rem auto;
  }
  p.desc {
    max-width: 34rem;
    line-height: 1.8;
    color: var(--muted);
    font-size: 1.05rem;
  }
  a.contact {
    display: inline-block;
    margin-top: 2.5rem;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: var(--silver);
    text-decoration: none;
    border: 1px solid #3a3d42;
    border-radius: 2px;
    padding: 0.8rem 1.6rem;
    transition: border-color 0.2s;
  }
  a.contact:hover { border-color: var(--accent); }
</style>
</head>
<body>
  <main>
    <p class="kicker">Coming Soon</p>
    <h1>Miao Silver Jewellery</h1>
    <div class="rule"></div>
    <p class="desc">
      Handcrafted silver jewellery by Miao artisans of Guizhou, China —
      generations of filigree, chasing and hammering traditions, made for the world.
    </p>
    <a class="contact" href="mailto:hello@randomplayx.com">hello@randomplayx.com</a>
  </main>
</body>
</html>
